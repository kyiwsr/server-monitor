services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monitor-net

  backend:
    build:
      # Context is the repo root (not ./backend) so the Dockerfile can COPY
      # agent.js, which lives at the repo root, into the image.
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/fyp-server-monitor
      JWT_SECRET: ${JWT_SECRET:-change-me}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      DOWN_CHECK_INTERVAL_SECONDS: ${DOWN_CHECK_INTERVAL_SECONDS:-30}
      METRIC_RETENTION_DAYS: ${METRIC_RETENTION_DAYS:-30}
      # Predictive (trend-based) alerting — see backend/utils/trendChecker.js
      TREND_CHECK_INTERVAL_SECONDS: ${TREND_CHECK_INTERVAL_SECONDS:-300}
      TREND_LOOKBACK_MINUTES: ${TREND_LOOKBACK_MINUTES:-30}
      TREND_MIN_SAMPLES: ${TREND_MIN_SAMPLES:-6}
      PREDICTION_WINDOW_HOURS: ${PREDICTION_WINDOW_HOURS:-6}
      # Seed the demo admin (admin@example.com / admin123) + demo server on boot.
      # Off by default — set to true only for demos/dev, never production.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Exposed so Linux agents on other machines can POST metrics to the backend
      - "3000:3000"
    networks:
      - monitor-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - monitor-net

volumes:
  mongo-data:

networks:
  monitor-net:
    driver: bridge
